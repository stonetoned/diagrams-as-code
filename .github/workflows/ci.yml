name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run CLI, metadata, renderer, and artifact tests
        run: make test

      - name: Build documentation
        run: make docs-build

      - name: Smoke test the packaged GitHub Action
        uses: ./
        with:
          command: render
          engine: dot
          name: easy
          source: diagrams
          output: action-smoke-output

      - name: Verify the Action artifact
        run: test -s action-smoke-output/dot/easy.png

      - name: Upload rendered examples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendered-diagrams
          path: output
          if-no-files-found: error
          retention-days: 7
